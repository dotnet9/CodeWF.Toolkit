<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-palette="default">
<head>
<meta charset="utf-8">
<title>CodeWF.Toolkit.Demo — 原型</title>
<style>
/* ═══════════ 色板（6 色板 × 浅深，与 CodeWF.Avalonia 原型一致） ═══════════ */
:root{
  --pri:#0064fa;--pri-h:#0057d4;--pri-lt:rgba(0,100,250,.09);
  --bg:#fff;--bg2:#f5f6f8;--bg3:#eef0f3;--tx:#1c1f23;--tx2:#646a73;--tx3:#8f959e;
  --bd:#d9dce1;--bd2:#e6e8ec;--hov:#eef0f3;--sel:#e3edff;--workbg:#eceef1;
  --ok:#26a346;--warn:#e8a103;--err:#e34d4d;--code:#f6f8fa;
}
[data-palette=aqua]{--pri:#0091a8;--pri-h:#007a8e;--pri-lt:rgba(0,145,168,.10);--sel:#dff5f8}
[data-palette=desert]{--pri:#c26a1d;--pri-h:#a85a15;--pri-lt:rgba(194,106,29,.10);--sel:#faf0e2}
[data-palette=dusk]{--pri:#7a5cc4;--pri-h:#654aa8;--pri-lt:rgba(122,92,196,.10);--sel:#efe9fb}
[data-palette=night]{--pri:#2b6cb0;--pri-h:#245a96;--pri-lt:rgba(43,108,176,.10);--sel:#e2edf9}
[data-palette=contrast]{--pri:#000;--pri-h:#000;--pri-lt:rgba(0,0,0,.08);--sel:#eee}
[data-theme=dark]{
  --bg:#1b1b1f;--bg2:#232327;--bg3:#2a2a30;--tx:#e6e6e8;--tx2:#9ea3ab;--tx3:#6b7078;
  --bd:#3a3a40;--bd2:#2b2b30;--hov:#2a2a30;--sel:#1d2c44;--workbg:#131316;--code:#16161a;
}
[data-theme=dark][data-palette=default]{--pri:#4d9aff;--pri-h:#6cadff;--pri-lt:rgba(77,154,255,.14);--sel:#1d2c44}
[data-theme=dark][data-palette=aqua]{--pri:#2ec3dd;--pri-h:#4fd0e8;--sel:#123c44}
[data-theme=dark][data-palette=desert]{--pri:#e8a355;--pri-h:#efb56f;--sel:#443318}
[data-theme=dark][data-palette=dusk]{--pri:#a98ae0;--pri-h:#bca0e8;--sel:#322a4a}
[data-theme=dark][data-palette=night]{--pri:#5b93cf;--pri-h:#74a8db;--sel:#1a2a3e}
[data-theme=dark][data-palette=contrast]{--pri:#fff;--pri-h:#fff;--pri-lt:rgba(255,255,255,.12);--sel:#333}

/* ═══════════ 桌面背景 + 窗口卡片 ═══════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 20% 0%,#1d2b53 0%,transparent 60%),
    radial-gradient(1000px 700px at 85% 100%,#0f3460 0%,transparent 55%),
    linear-gradient(135deg,#0b1322 0%,#101b30 100%);
  display:flex;align-items:center;justify-content:center;
  padding:22px;font:13px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--tx);
  overflow:hidden;user-select:none;
}
.win{
  width:min(1480px,100%);height:100%;min-height:640px;
  background:var(--bg);border-radius:10px;overflow:hidden;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 24px 70px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.35);
  display:grid;grid-template-rows:36px 30px auto 1fr auto;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:5px;border:2px solid transparent;background-clip:padding-box}

/* ═══ 1. 标题栏 ═══ */
.cap{display:flex;align-items:center;height:36px;padding-left:12px;gap:8px;
  background:linear-gradient(90deg,var(--pri) 0%,var(--pri-h) 30%,rgba(0,0,0,0) 62%),var(--bg2);
  border-bottom:1px solid var(--bd)}
.cap .lg{font-weight:700;color:#fff;letter-spacing:.5px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.cap .ver{font-size:11px;color:#fff;opacity:.8}
.cap .sp{flex:1}
.cap select{height:23px;font-size:11px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx)}
.cap .wb{width:44px;height:36px;display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;cursor:pointer;color:var(--tx2);font-size:12px}
.cap .wb:hover{background:var(--hov);color:var(--tx)}
.cap .wb.cls:hover{background:var(--err);color:#fff}
.cap .pal{display:inline-flex;gap:5px;align-items:center;margin:0 2px}
.cap .pal i{width:12px;height:12px;border-radius:50%;cursor:pointer;border:1px solid rgba(128,128,128,.55);display:block;transition:transform .12s}
.cap .pal i:hover{transform:scale(1.25)}

/* ═══ 2. Ribbon 页签行 ═══ */
.rtabs{display:flex;align-items:center;height:30px;padding:0 10px;gap:2px;background:var(--bg);border-bottom:1px solid var(--bd)}
.qk{display:flex;align-items:center;gap:2px;margin-right:10px;padding-right:12px;border-right:1px solid var(--bd2)}
.qk button{width:27px;height:25px;border:none;background:transparent;border-radius:4px;cursor:pointer;color:var(--tx2);font-size:13px}
.qk button:hover{background:var(--hov);color:var(--pri)}
.rt2{display:flex;align-items:center;height:100%;gap:3px;overflow:hidden}
.rt2 .t2{padding:0 14px;height:100%;line-height:30px;cursor:pointer;color:var(--tx2);font-size:12.5px;
  user-select:none;letter-spacing:1px;position:relative;white-space:nowrap}
.rt2 .t2:hover{color:var(--pri)}
.rt2 .t2.on{color:var(--pri);font-weight:600}
.rt2 .t2.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--pri);border-radius:2px 2px 0 0}

/* ═══ 3. Ribbon 命令区（可折叠，双击页签折叠） ═══ */
.rbn{background:var(--bg);border-bottom:1px solid var(--bd);padding:7px 16px 4px;
  display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;
  transition:padding .15s ease,opacity .12s ease}
body.rmn .rbn{padding-top:0;padding-bottom:0;min-height:0;height:0;opacity:0;border-bottom:none}
.grp{display:flex;flex-direction:column;padding:0 14px;border-right:1px solid var(--bd2);flex:none}
.grp:last-child{border-right:none}
.grp .cmds{display:flex;gap:3px;flex:1;align-items:flex-start;flex-wrap:wrap;align-content:flex-start}
.grp .gname{text-align:center;font-size:10px;color:var(--tx3);padding-top:4px;letter-spacing:2px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;padding:7px 6px 4px;
  border:none;background:transparent;cursor:pointer;border-radius:6px;color:var(--tx)}
.cbtn:hover{background:var(--hov)}
.cbtn:active{background:var(--pri-lt)}
.cbtn .ic{font-size:21px;line-height:1.1}
.cbtn .lb{font-size:11px;text-align:center;white-space:nowrap}

/* ═══ 4. 主内容 = Dock 工作区 ═══ */
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 10px;background:var(--workbg);overflow:hidden}
.dockrow{flex:1;min-height:0;display:flex;gap:8px}
.panel{background:var(--bg);border:1px solid var(--bd);border-radius:8px;display:flex;flex-direction:column;
  overflow:hidden;min-height:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.phd{display:flex;align-items:center;height:30px;flex:none;padding:0 10px;background:var(--bg2);
  border-bottom:1px solid var(--bd);font-size:11px;font-weight:700;color:var(--tx2);gap:6px;letter-spacing:.5px}
.phd .tb{margin-left:auto;display:flex;gap:2px}
.phd .tb button{min-width:22px;height:20px;border:none;background:transparent;cursor:pointer;border-radius:3px;
  color:var(--tx2);font-size:11px;white-space:nowrap;padding:0 5px}
.phd .tb button:hover{background:var(--pri-lt);color:var(--pri)}
.pbd{flex:1;min-height:0;overflow:auto}
.p-nav{width:232px;flex:none}
body.hideL .p-nav{display:none}
.p-props{width:268px;flex:none}
body.hideR .p-props{display:none}
.p-log{height:152px;flex:none}
body.hideLog .p-log{display:none}

/* 左：导航树 */
.tree{padding:5px}
.tree .nd .hd{display:flex;align-items:center;gap:5px;height:27px;padding:0 6px;border-radius:5px;cursor:pointer}
.tree .nd .hd:hover{background:var(--hov)}
.tree .nd .hd .arw{width:12px;font-size:9px;color:var(--tx3);transition:transform .12s}
.tree .nd.open>.hd .arw{transform:rotate(90deg)}
.tree .nd .kids{display:none;margin-left:15px;border-left:1px solid var(--bd2);padding-left:5px}
.tree .nd.open>.kids{display:block}
.tree .lf{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:5px;cursor:pointer;color:var(--tx2)}
.tree .lf:hover{background:var(--hov);color:var(--tx)}
.tree .lf.on{background:var(--sel);color:var(--pri);font-weight:600}

/* 中：文档区 */
.p-doc{flex:1;min-width:0}
.dts{display:flex;align-items:center;gap:6px;height:30px;flex:none;padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--bd);overflow-x:auto}
.dkb{display:flex;gap:2px;padding-right:8px;border-right:1px solid var(--bd2)}
.dkb button{height:20px;border:none;background:transparent;border-radius:3px;cursor:pointer;color:var(--tx2);font-size:11px;padding:0 6px;white-space:nowrap}
.dkb button:hover{background:var(--pri-lt);color:var(--pri)}
.dt{display:flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:4px;cursor:pointer;font-size:11.5px;color:var(--tx2);white-space:nowrap}
.dt:hover{background:var(--hov)}
.dt.on{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.dt .x{opacity:.55}
.dt .x:hover{color:var(--err)}
.dbody{flex:1;min-height:0;overflow:auto;padding:14px 16px}

/* 右：属性面板 */
.pgp{padding:4px}
.pgp .cat{font-size:10.5px;font-weight:700;color:var(--tx3);letter-spacing:1px;padding:8px 8px 4px}
.pgp .row{display:flex;align-items:center;gap:8px;min-height:28px;padding:0 8px;border-radius:4px}
.pgp .row:hover{background:var(--hov)}
.pgp .row .nm{flex:1;font-size:11.5px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgp .row .vl{font-size:11.5px;color:var(--tx);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgp .sw{width:30px;height:16px;border-radius:9px;background:var(--bd);position:relative;cursor:pointer;flex:none;transition:background .12s}
.pgp .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .12s}
.pgp .sw.on{background:var(--pri)}
.pgp .sw.on::after{left:16px}
.pgp select,.pgp input[type=number]{height:22px;font-size:11px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);max-width:130px}

/* 底部：日志 */
#logP{padding:4px 8px;font:11.5px/1.7 Consolas,"Cascadia Mono",monospace}
#logP .ll1{color:var(--tx2)}
#logP .ll2{color:var(--warn)}
#logP .ll3{color:var(--err)}
#logP .ltm{color:var(--tx3);margin-right:8px}

/* ═══ 5. 状态栏 ═══ */
.tbar{display:flex;align-items:center;gap:10px;height:26px;padding:0 10px;background:var(--bg2);
  border-top:1px solid var(--bd);font-size:11px;color:var(--tx2)}
.tbar .sp{flex:1}
.tbar .badge{background:var(--pri);color:#fff;border-radius:3px;padding:1px 6px;font-weight:700}
.tbar button{height:19px;border:1px solid var(--bd);background:var(--bg);border-radius:3px;cursor:pointer;font-size:11px;padding:0 7px;color:var(--tx2)}
.tbar button:hover{border-color:var(--pri);color:var(--pri)}

/* ═══ 文档页通用件 ═══ */
h3.dh{font-size:15px;margin:0 0 2px}
p.dsub{color:var(--tx2);font-size:12px;margin-bottom:12px}
.card{border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:12px;background:var(--bg)}
.card h4{font-size:12.5px;margin-bottom:8px;color:var(--tx)}
.card .hint{font-size:11px;color:var(--tx3);margin-top:6px}
table.tb{width:100%;border-collapse:collapse;font-size:11.5px}
table.tb th,table.tb td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--bd2)}
table.tb th{color:var(--tx3);font-weight:600;font-size:11px}
code{font:11.5px Consolas,"Cascadia Mono",monospace;background:var(--code);border:1px solid var(--bd2);border-radius:3px;padding:0 4px}
pre.code{background:var(--code);border:1px solid var(--bd2);border-radius:6px;padding:10px 12px;overflow:auto;
  font:11.5px/1.65 Consolas,"Cascadia Mono",monospace;color:var(--tx);margin:8px 0}
.row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
input.tin,select.tin{height:26px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);padding:0 8px;font-size:12px}
textarea.tin{border:1px solid var(--bd);border-radius:5px;background:var(--bg);padding:8px;font:11.5px/1.6 Consolas,monospace;width:100%;resize:vertical}
button.b{border:1px solid var(--bd);background:var(--bg);border-radius:5px;height:26px;padding:0 10px;cursor:pointer;font-size:12px}
button.b:hover{border-color:var(--pri);color:var(--pri)}
button.b.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.b.pri:hover{background:var(--pri-h)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list{border:1px solid var(--bd);border-radius:6px;min-height:120px;max-height:220px;overflow:auto}
.list .it{display:flex;align-items:center;gap:8px;padding:5px 9px;font-size:11.5px;cursor:pointer;border-bottom:1px solid var(--bd2)}
.list .it:hover{background:var(--hov)}
.list .it.on{background:var(--sel);color:var(--pri)}
.lgst{height:170px;overflow:auto;border:1px solid var(--bd);border-radius:6px;padding:6px 9px;
  font:11.5px/1.7 Consolas,monospace;background:var(--code)}
.lgst .w{color:var(--warn)}.lgst .e{color:var(--err)}.lgst .d{color:var(--tx3)}
.hex{font:11.5px/1.8 Consolas,monospace;background:var(--code);border:1px solid var(--bd2);border-radius:6px;padding:8px 10px;word-break:break-all}
.kv{display:flex;gap:8px;align-items:center;font-size:11.5px;margin:3px 0}
.kv .k{color:var(--tx3);min-width:86px}

/* ═══ Guide ═══ */
.guide-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.guide-mask.on{display:block}
.guide-tip{position:fixed;z-index:42;width:320px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;
  padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.5);display:none}
.guide-tip.on{display:block}
.guide-tip .t{font-weight:700;margin-bottom:6px}
.guide-tip .d{font-size:12px;color:var(--tx2);line-height:1.7}
.guide-tip .nav{display:flex;align-items:center;margin-top:12px;gap:6px}
.guide-tip .stepno{flex:1;font-size:11px;color:var(--tx3)}
.guide-tip button{height:24px;border:1px solid var(--bd);background:var(--bg);border-radius:4px;cursor:pointer;font-size:11.5px;padding:0 9px}
.guide-tip button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
</style>
<script>
window.addEventListener("error",function(e){
 var d=document.getElementById("jsErrTrap")||function(){var x=document.createElement("div");x.id="jsErrTrap";
  x.style.cssText="position:fixed;top:0;left:0;z-index:999;background:#000;color:#f88;font:12px monospace;padding:4px 10px;max-width:100%;white-space:pre-wrap";
  document.documentElement.appendChild(x);return x}();
 d.textContent+="JS错误: "+e.message+" @"+(e.filename||"").split("/").pop()+":"+e.lineno+String.fromCharCode(10);
});
</script>
</head>
<body>

<div class="win">

  <!-- ═══ 1. 标题栏 ═══ -->
  <div class="cap">
    <span class="lg">◆ CodeWF.Toolkit</span><span class="ver">Demo · v1.0.0</span>
    <span class="sp"></span>
    <span class="pal" id="palDots"></span>
    <select id="palSel" title="色板">
      <option value="default">默认</option>
      <option value="aqua">水生</option>
      <option value="desert">沙漠</option>
      <option value="dusk">黄昏</option>
      <option value="night">夜空</option>
      <option value="contrast">高对比</option>
    </select>
    <button class="wb" id="darkBtn" style="width:30px" title="深/浅">◐</button>
    <button class="wb" id="langBtn" style="width:34px;font-weight:700" title="中/EN">文A</button>
    <button class="wb">—</button><button class="wb">□</button><button class="wb cls">✕</button>
  </div>

  <!-- ═══ 2. Ribbon 页签行 ═══ -->
  <div class="rtabs" id="rTabsBar">
    <div class="qk">
      <button title="打开引导" id="qkGuide">❔</button>
      <button title="重置工作区" id="qkReset">↺</button>
      <button title="保存日志" id="qkSave">💾</button>
    </div>
    <div class="rt2" id="rTabs"></div>
  </div>

  <!-- ═══ 3. Ribbon 命令区 ═══ -->
  <div class="rbn" id="rBody"></div>

  <!-- ═══ 4. 主内容 = Dock 工作区 ═══ -->
  <div class="main">
    <div class="dockrow">

      <div class="panel p-nav">
        <div class="phd"><span>◈ <span data-i18n="nav">导航树</span></span>
          <span class="tb"><button id="hideNav" title="隐藏面板">◀</button></span>
        </div>
        <div class="pbd tree" id="lTree"></div>
      </div>

      <div class="panel p-doc">
        <div class="dts">
          <span class="dkb">
            <button id="dkNav" data-i18n="dock.nav">导航树</button>
            <button id="dkProps" data-i18n="dock.props">属性</button>
            <button id="dkLog" data-i18n="dock.log">日志</button>
            <button id="dkReset" data-i18n="dock.reset">重置</button>
          </span>
          <span id="dT" style="display:flex;gap:4px"></span>
        </div>
        <div class="dbody" id="dBody"></div>
      </div>

      <div class="panel p-props">
        <div class="phd"><span>⚙ <span data-i18n="props">属性</span></span>
          <span class="tb"><button id="hideProp2" title="隐藏面板">▶</button></span>
        </div>
        <div class="pbd pgp" id="pGrid"></div>
      </div>

    </div>

    <div class="panel p-log">
      <div class="phd"><span>▤ <span data-i18n="log">日志</span></span>
        <span class="tb">
          <button id="clrLogBtn" data-i18n="log.clear">清空</button>
          <button id="hideLogBtn" title="折叠日志面板">▼</button>
        </span>
      </div>
      <div class="pbd" id="logP"></div>
    </div>
  </div>

  <!-- ═══ 5. 状态栏 ═══ -->
  <div class="tbar">
    <span class="badge" data-i18n="status.app">演示台</span>
    <span id="stTx" data-i18n="ready">就绪</span>
    <span class="sp"></span>
    <button id="logToggleBtn" data-i18n="status.logpanel">日志面板</button>
    <button id="darkBtn2">◐ <span data-i18n="status.theme">深浅</span></button>
    <button id="langBtn2">文A <span data-i18n="status.lang">中英</span></button>
    <span>net10.0 · CodeWF.Toolkit 1.0.0</span>
  </div>

</div><!-- /.win -->

<div class="guide-mask" id="gMask"></div>
<div class="guide-tip" id="gTip">
  <div class="t" id="gT"></div><div class="d" id="gD"></div>
  <div class="nav">
    <span class="stepno" id="gN"></span>
    <span><button id="gPrev">上一步</button><button id="gNext" class="pri">下一步</button><button id="gClose">关闭</button></span>
  </div>
</div>

<script>
"use strict";
var $=function(id){return document.getElementById(id)};
var LANG="zh-CN";
var I18N={
 "zh-CN":{"tabs.home":"首 页","tabs.core":"核 心","tabs.bus":"事件总线","tabs.files":"文 件","tabs.image":"图 像","tabs.logging":"日 志","tabs.net":"网 络",
   "nav":"导航树","props":"属性","log":"日志","ready":"就绪",
   "dock.nav":"导航树","dock.props":"属性","dock.log":"日志","dock.reset":"重置",
   "log.clear":"清空","status.app":"演示台","status.logpanel":"日志面板","status.theme":"深浅","status.lang":"中英",
   "ph.tools":"演示页","ph.core":"核心能力"},
 "en-US":{"tabs.home":"Home","tabs.core":"Core","tabs.bus":"EventBus","tabs.files":"Files","tabs.image":"Image","tabs.logging":"Logging","tabs.net":"Net",
   "nav":"Explorer","props":"Properties","log":"Log","ready":"Ready",
   "dock.nav":"Explorer","dock.props":"Properties","dock.log":"Log","dock.reset":"Reset",

<script>

 '<div class="card"><h4>协议声明</h4><pre class="code">[NetHead(0x01, 1)]&#10;public sealed class SamplePacket : INetObject&#10;{&#10;    [NetFieldOrder(0)] public int Id { get; set; }&#10;    [NetFieldOrder(1)] public float Score { get; set; }&#10;    [NetFieldOrder(2)] public string Title { get; set; } = string.Empty;&#10;}&#10;&#10;var buffer = packet.Serialize(systemId: 0);&#10;var restored = buffer.Deserialize&lt;SamplePacket&gt;();</pre>'+

window.nsStop=function(){window._nsOn=false;var s=$("nsSt");if(s)s.textContent="● 未启动";var c=$("nsClients");if(c)c.textContent="0";
 log2both("服务端已停止","warn")};
window.nsSend=function(){if(!window._nsOn){log2both("请先启动服务端","error");return}
 var cmd=($("nsCmd")||{}).value;var f=$("nsFeed");log2both("SendCommandAsync(new "+cmd+"())");
 if(f)f.innerHTML+="<div>→ "+esc(cmd)+" … 200 OK</div>"};
window.nsUdp=function(){var f=$("nsFeed");log2both("UdpSocketClient.Send(discovery)");if(f)f.innerHTML+="<div class='w'>UDP 广播已发出</div>"};
window.nsTransfer=function(){var rows=$("nsFiles").rows,i=1;log2both("FileDownloadRequest(dataset.zip) 开始");
 var tick=0;var t=setInterval(function(){tick+=20;
  if(rows[i])rows[i].cells[2].textContent=Math.min(tick,100)+"%";
  if(tick>=100){clearInterval(t);log2both("FileTransferComplete(dataset.zip) 校验通过")}},220)};
window.nsResume=function(){var rows=$("nsFiles").rows;if(rows[1])rows[1].cells[2].textContent="从 62% 续传…";
 log2both("断点续传：FileChunkAck 从最后确认块继续")};
</script>

<script>
/* ═══ Ribbon / 树 / 文档 / 属性 渲染 ═══ */
var RTABS=[["home","tabs.home"],["core","tabs.core"],["bus","tabs.bus"],["files","tabs.files"],["image","tabs.image"],["logging","tabs.logging"],["net","tabs.net"]];
var curTab="home",OPEN_DOCS=[],ACTIVE_DOC=null;
function tabName(id){return tt("tabs."+id)}
function renderRTabs(){$("rTabs").innerHTML=RTABS.map(function(x){
 return '<div class="t2'+(x[0]===curTab?" on":"")+'" data-t="'+x[0]+'">'+tabName(x[0])+"</div>"}).join("");
 document.querySelectorAll(".rt2 .t2").forEach(function(n){
  n.onclick=function(){switchTab(n.dataset.t)};
  n.ondblclick=function(){toggleRibbon()}})}
function switchTab(id){curTab=id;renderRTabs();renderRBody();renderTree();
 var g=CATALOG.find(function(x){return x.id===id});if(g&&g.items[0])openDoc(g.items[0].id);
 log2both("切换页签："+tabName(id))}
function renderRBody(){var g=CATALOG.find(function(x){return x.id===curTab});if(!g){$("rBody").innerHTML="";return}
 var grp={home:[[["welcome","🏠","欢迎"]]],core:[[["core","🧰","Core"]]],
  bus:[[["bus","📣","进程内总线"],["bus-integrations","🔌","总线集成"]]],
  files:[[["files-json","📄","格式读写"],["files-archive","🗜️","压缩/配置"]]],
  image:[[["image-icon","🎨","图标生成"],["image-qr","🔳","二维码/水印"]]],
  logging:[[["log-core","📋","Logger" ],["log-microsoft","🧾","MEL 接入"]]],
  net:[[["net-packet","📦","序列化"],["net-socket","🔗","TCP/UDP"]]]}[curTab]||[];
 var names={home:["演示页"],core:["核心能力"],bus:["发布订阅","集成形态"],files:["格式","归档"],image:["图标","二维码"],logging:["核心","Microsoft"],net:["NetWeaver","NetWrapper"]}[curTab]||[];
 $("rBody").innerHTML=grp.map(function(commands,gi){
  return '<div class="grp"><div class="cmds">'+commands.map(function(c){
   return '<button class="cbtn" data-p="'+c[0]+'"><span class="ic">'+c[1]+'</span><span class="lb">'+c[2]+"</span></button>"}).join("")+
  '</div><div class="gname">'+(names[gi]||"")+"</div></div>"}).join("");
 document.querySelectorAll(".rbn .cbtn").forEach(function(b){b.onclick=function(){openDoc(b.dataset.p)}})}
function toggleRibbon(){document.body.classList.toggle("rmn");
 log2both((document.body.classList.contains("rmn")?"折叠":"展开")+" Ribbon 命令区")}
function renderTree(){$("lTree").innerHTML=CATALOG.map(function(g){
 var open=g.id===curTab;
 return '<div class="nd'+(open?" open":"")+'" data-g="'+g.id+'"><div class="hd"><span class="arw">▶</span><span>'+g.icon+'</span><span>'+tabName(g.id)+'</span></div><div class="kids">'+
  g.items.map(function(it){return '<div class="lf'+(it.id===ACTIVE_DOC?" on":"")+'" data-p="'+it.id+'">'+pt(it.id)+"</div>"}).join("")+
  "</div></div>"}).join("");
 document.querySelectorAll(".tree .nd .hd").forEach(function(h){h.onclick=function(){switchTab(h.parentNode.dataset.g)}});
 document.querySelectorAll(".tree .lf").forEach(function(l){l.onclick=function(e){e.stopPropagation();openDoc(l.dataset.p)}})}
function openDoc(id){if(!PG[id])return;
 if(OPEN_DOCS.indexOf(id)<0)OPEN_DOCS.push(id);
 ACTIVE_DOC=id;renderDocTabs();renderDoc(id);renderTree();renderPGrid(id);
 log2both("打开文档："+pt(id))}
function closeDoc(id){OPEN_DOCS=OPEN_DOCS.filter(function(x){return x!==id});
 if(ACTIVE_DOC===id)ACTIVE_DOC=OPEN_DOCS[OPEN_DOCS.length-1]||null;
 renderDocTabs();if(ACTIVE_DOC)renderDoc(ACTIVE_DOC);else $("dBody").innerHTML="";renderTree();renderPGrid(ACTIVE_DOC);
 log2both("关闭文档："+pt(id))}
function renderDocTabs(){$("dT").innerHTML=OPEN_DOCS.map(function(id){
 return '<span class="dt'+(id===ACTIVE_DOC?" on":"")+'" data-p="'+id+'">'+pt(id)+'<span class="x" data-c="'+id+'">✕</span></span>'}).join("");
 document.querySelectorAll("#dT .dt").forEach(function(n){
  n.onclick=function(e){if(e.target.dataset.c){closeDoc(e.target.dataset.c);return}openDoc(n.dataset.p)}})}
function renderDoc(id){var pg=PG[id];if(!pg)return;var meta=pg.zh;$("dBody").innerHTML=meta.html;
 dlog("文档内容就绪："+pt(id));
 if(id==="bus"){var f=$("busFeed");if(f)f.innerHTML="<div class='d'>总线就绪：3 个订阅已注册</div>"}
 if(id==="image-icon"&&window.icMerge)icMerge();
 if(id==="image-qr"&&window.qrMake)qrMake();
 if(id==="net-packet"&&window.pktDraw)pktDraw()}
function renderPGrid(id,props){if(!props){var pg=id?PG[id]:null;props=pg?(pg.zh.props||[]):[]}
 var html='<div class="cat">'+tt("ph.core")+"</div>";
 html+=props.map(function(p){
  var v='<span class="vl">'+esc(p.value)+"</span>";
  if(p.kind==="sw")v='<span class="sw'+(p.value?" on":"")+'" data-k="'+p.id+'"></span>';
  else if(p.kind==="num")v='<input type="number" value="'+p.value+'" style="width:78px">';
  else if(p.kind==="sel")v='<select>'+p.options.map(function(o){return "<option"+(o===p.value?" selected":"")+">"+o+"</option>"}).join("")+"</select>";
  return '<div class="row"><span class="nm">'+esc(p.name)+"</span>"+v+"</div>"}).join("");
 html+='<div class="cat">'+tt("ph.tools")+'</div><div class="row"><span class="nm">当前文档</span><span class="vl">'+(ACTIVE_DOC?esc(pt(ACTIVE_DOC)):"—")+"</span></div>"+
  '<div class="row"><span class="nm">打开文档数</span><span class="vl">'+OPEN_DOCS.length+"</span></div>";
 $("pGrid").innerHTML=html;
 document.querySelectorAll(".pgp .sw").forEach(function(s){s.onclick=function(){s.classList.toggle("on");
  log2both("属性切换："+s.dataset.k+" = "+s.classList.contains("on"))}})}
</script>

<script>
/* ═══ 外观 / 语言 / 面板 / 引导 ═══ */
var PAL=[["default","#0064fa"],["aqua","#0091a8"],["desert","#c26a1d"],["dusk","#7a5cc4"],["night","#2b6cb0"],["contrast","#000"]];
$("palDots").innerHTML=PAL.map(function(p){return '<i data-p="'+p[0]+'" style="background:'+p[1]+'"></i>'}).join("");
document.querySelectorAll("#palDots i").forEach(function(d){d.onclick=function(){
 var v=d.dataset.p;document.documentElement.dataset.palette=v;$("palSel").value=v;log2both("色板 = "+v)}});
$("palSel").onchange=function(){document.documentElement.dataset.palette=this.value;log2both("色板 = "+this.value)};
function toggleDark(){var h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";
 log2both("主题 = "+(h.dataset.theme==="dark"?"深色":"浅色"))}
$("darkBtn").onclick=toggleDark;$("darkBtn2").onclick=toggleDark;
function toggleLang(){LANG=LANG==="zh-CN"?"en-US":"zh-CN";
 document.querySelectorAll("[data-i18n]").forEach(function(n){n.textContent=tt(n.dataset.i18n)});
 renderRTabs();renderTree();renderPGrid(ACTIVE_DOC);log2both("语言 = "+LANG)}
$("langBtn").onclick=toggleLang;$("langBtn2").onclick=toggleLang;
$("hideNav").onclick=function(){document.body.classList.toggle("hideL")};
$("hideProp2").onclick=function(){document.body.classList.toggle("hideR")};
$("dkNav").onclick=function(){document.body.classList.toggle("hideL")};
$("dkProps").onclick=function(){document.body.classList.toggle("hideR")};
$("dkLog").onclick=function(){document.body.classList.toggle("hideLog")};
$("dkReset").onclick=function(){document.body.className=document.body.className.replace(/\b(hideL|hideR|hideLog|rmn)\b/g,"").trim();log2both("工作区已重置")};
$("hideLogBtn").onclick=function(){document.body.classList.toggle("hideLog")};
$("logToggleBtn").onclick=function(){document.body.classList.toggle("hideLog")};
$("clrLogBtn").onclick=function(){$("logP").innerHTML="";dlog("日志已清空")};
$("qkGuide").onclick=function(){guideOpen()};
$("qkReset").onclick=$("dkReset").onclick;
$("qkSave").onclick=function(){log2both("日志已导出到 logs/app.log")};

/* Guide 引导 */
var GSTEPS=[
 {t:"欢迎使用 CodeWF.Toolkit 演示台",d:"这是与 CodeWF.Avalonia 原型同款的外壳：Ribbon 页签 + Dock 工作区 + 属性面板 + 日志面板。",
  sel:"#rTabsBar",pos:"bottom"},
 {t:"导航树",d:"左侧按能力域分组：核心、事件总线、文件、图像、日志、网络，点条目即打开对应演示页。",
  sel:".p-nav",pos:"right"},
 {t:"Ribbon 命令区",d:"每个页签下是能力命令；双击页签（或点状态栏按钮）可折叠命令区腾出空间。",
  sel:"#rBody",pos:"bottom"},
 {t:"文档区",d:"所有演示以文档页形式打开，支持多页签并存与关闭；顶排是 Dock 面板开关。",
  sel:".p-doc",pos:"bottom"},
 {t:"属性面板",d:"右侧实时显示当前文档的配置项，开关/下拉/数值都可交互（原型内为演示状态）。",
  sel:".p-props",pos:"left"},
 {t:"日志面板",d:"底部是 Toolkit 日志能力的自我演示：所有操作都会写入这里，对应 Logging 包。",
  sel:".p-log",pos:"top"}];
var gi=0;
function guideOpen(){gi=0;document.body.classList.add("hide");guideShow()}
function guideShow(){var s=GSTEPS[gi];if(!s){guideClose();return}
 $("gMask").classList.add("on");$("gTip").classList.add("on");
 $("gT").textContent=s.t;$("gD").textContent=s.d;$("gN").textContent=(gi+1)+" / "+GSTEPS.length;
 var el=document.querySelector(s.sel),r=el?el.getBoundingClientRect():null;
 var tip=$("gTip"),w=320;
 var left=r?Math.min(window.innerWidth-w-16,Math.max(16,r.left)) : 40;
 var top=r?Math.min(window.innerHeight-180,r.bottom+10) : 80;
 if(s.pos==="right"&&r){left=Math.min(window.innerWidth-w-16,r.right+12);top=Math.max(16,r.top)}
 if(s.pos==="top"&&r){top=Math.max(16,r.top-170)}
 if(s.pos==="left"&&r){left=Math.max(16,r.left-w-12);top=Math.max(16,r.top)}
 tip.style.left=left+"px";tip.style.top=top+"px"}
$("gNext").onclick=function(){gi++;guideShow()};
$("gPrev").onclick=function(){gi=Math.max(0,gi-1);guideShow()};
$("gClose").onclick=function(){guideClose()};
function guideClose(){$("gMask").classList.remove("on");$("gTip").classList.remove("on")}

/* 启动 */
renderRTabs();renderRBody();renderTree();renderPGrid(null);
openDoc("welcome");
dlog("CodeWF.Toolkit 演示台就绪（7 组 12 页）");
dlog("提示：双击 Ribbon 页签可折叠命令区；右上角可切色板与深浅色");
</script>
</body>
</html>
