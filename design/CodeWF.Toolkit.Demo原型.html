<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-palette="dotnet" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeWF.Toolkit.Demo — 原型</title>
<style>
/* ═══════════ 色板（6 色板 × 浅深，与 CodeWF.Avalonia 原型一致） ═══════════ */
:root{
  --pri:#0064fa;--pri-h:#0057d4;--pri-lt:rgba(0,100,250,.09);
  --bg:#fff;--bg2:#f5f6f8;--bg3:#eef0f3;--tx:#1c1f23;--tx2:#5c626b;--tx3:#757c85;
  --bd:#d9dce1;--bd2:#e6e8ec;--hov:#eef0f3;--sel:#e3edff;--workbg:#e4e7ec;
  --ok:#1f8a3b;--warn:#e8a103;--err:#c62828;--code:#f6f8fa;
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;
}
[data-palette=aqua]{--pri:#0091a8;--pri-h:#007a8e;--pri-lt:rgba(0,145,168,.10);--sel:#dff5f8}
[data-palette=desert]{--pri:#c26a1d;--pri-h:#a85a15;--pri-lt:rgba(194,106,29,.10);--sel:#faf0e2}
[data-palette=dusk]{--pri:#7a5cc4;--pri-h:#654aa8;--pri-lt:rgba(122,92,196,.10);--sel:#efe9fb}
[data-palette=night]{--pri:#2b6cb0;--pri-h:#245a96;--pri-lt:rgba(43,108,176,.10);--sel:#e2edf9}
[data-palette=contrast]{--pri:#000;--pri-h:#000;--pri-lt:rgba(0,0,0,.08);--sel:#eee}
[data-theme=dark]{
  --bg:#1b1b1f;--bg2:#232327;--bg3:#2a2a30;--tx:#e6e6e8;--tx2:#b3b8c0;--tx3:#8d939c;
  --bd:#3a3a40;--bd2:#2b2b30;--hov:#2a2a30;--sel:#1d2c44;--workbg:#111114;--code:#16161a;
}
[data-theme=dark][data-palette=default]{--pri:#4d9aff;--pri-h:#6cadff;--pri-lt:rgba(77,154,255,.14);--sel:#1d2c44}
[data-theme=dark][data-palette=aqua]{--pri:#2ec3dd;--pri-h:#4fd0e8;--sel:#123c44}
[data-theme=dark][data-palette=desert]{--pri:#e8a355;--pri-h:#efb56f;--sel:#443318}
[data-theme=dark][data-palette=dusk]{--pri:#a98ae0;--pri-h:#bca0e8;--sel:#322a4a}
[data-theme=dark][data-palette=night]{--pri:#5b93cf;--pri-h:#74a8db;--sel:#1a2a3e}
[data-theme=dark][data-palette=contrast]{--pri:#fff;--pri-h:#fff;--pri-lt:rgba(255,255,255,.12);--sel:#333}
[data-palette=contrast] .cap .lg,[data-palette=contrast] .cap .ver{color:#fff}
[data-palette=contrast] .bd h1{color:var(--tx)}

/* ═══════════ 桌面背景 + 窗口卡片 ═══════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 20% 0%,#1d2b53 0%,transparent 60%),
    radial-gradient(1000px 700px at 85% 100%,#0f3460 0%,transparent 55%),
    linear-gradient(135deg,#0b1322 0%,#101b30 100%);
  display:flex;align-items:center;justify-content:center;
  padding:14px;font:13px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--tx);
  overflow:hidden;user-select:none;
}
.win{
  width:min(1480px,100%);height:100%;min-height:640px;
  background:var(--bg);border-radius:10px;overflow:hidden;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 24px 70px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.35);
  display:grid;grid-template-rows:34px 32px auto 1fr 28px;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--tx3)}

/* ═══ 通用：线性图标（stroke 走 currentColor，对齐 IconPark / TDesign 风格） ═══ */
.svgic{display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .16s ease,color .12s ease}
.svgic.s14{width:14px;height:14px}
.svgic.s16{width:16px;height:16px}
.svgic.s18{width:18px;height:18px}
.svgic.s20{width:20px;height:20px}
.svgic.s22{width:22px;height:22px}

/* ═══ 1. 标题栏 34px ═══ */
.cap{display:flex;align-items:center;height:34px;padding-left:10px;gap:8px;
  background:linear-gradient(90deg,var(--pri) 0%,var(--pri-h) 26%,rgba(0,0,0,0) 58%),var(--bg2);
  border-bottom:1px solid var(--bd)}
.cap .logo{width:20px;height:20px;border-radius:5px;display:block;flex:none;
  box-shadow:0 1px 5px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.22)}
.cap .lg{font-weight:700;color:#fff;letter-spacing:.4px;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cap .vbadge{font-size:10px;padding:0 7px;line-height:16px;border-radius:999px;color:#fff;
  background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.34)}
.cap .sp{flex:1}
.cap select{height:22px;font-size:11px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx)}
.cap .wb{width:40px;height:34px;display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;cursor:pointer;color:var(--tx2);transition:background .12s,color .12s}
.cap .wb svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cap .wb:hover{background:var(--hov);color:var(--tx)}
.cap .wb:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.cap .wb.cls:hover{background:var(--err);color:#fff}
.cap .pal{display:inline-flex;gap:5px;align-items:center;margin:0 2px}
.cap .pal i{width:12px;height:12px;border-radius:50%;cursor:pointer;border:1px solid rgba(128,128,128,.55);display:block;transition:transform .12s,box-shadow .12s}
.cap .pal i:hover{transform:scale(1.25)}
.cap .pal i.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--pri)}

/* ═══ 2. Ribbon 页签行 32px ═══ */
.rtabs{display:flex;align-items:center;height:32px;padding:0 10px;gap:2px;background:var(--bg);border-bottom:1px solid var(--bd)}
.qk{display:flex;align-items:center;gap:2px;margin-right:10px;padding-right:12px;border-right:1px solid var(--bd2)}
.qk button{width:28px;height:26px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;
  border-radius:4px;cursor:pointer;color:var(--tx2);transition:background .12s,color .12s}
.qk button:hover{background:var(--hov);color:var(--pri)}
.qk button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.rt2{display:flex;align-items:center;height:100%;gap:2px;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap}
.rt2 .t2{display:inline-flex;align-items:center;gap:6px;flex:none;padding:0 14px;height:100%;cursor:pointer;
  color:var(--tx2);font-size:12.5px;user-select:none;letter-spacing:.6px;position:relative;white-space:nowrap;
  border-radius:4px 4px 0 0;transition:background .12s,color .12s}
.rt2 .t2:hover{color:var(--pri);background:var(--hov)}
.rt2 .t2:focus-visible{outline:2px solid var(--pri);outline-offset:-4px}
.rt2 .t2.on{color:var(--pri);font-weight:600}
.rt2 .t2.on::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--pri);border-radius:2px 2px 0 0}
.qk2{margin-left:auto;display:flex;align-items:center;gap:2px;padding-left:10px}
.qk2 button{height:26px;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;
  border-radius:4px;cursor:pointer;color:var(--tx2);font-size:11px;padding:0 9px;white-space:nowrap;
  transition:background .12s,color .12s,border-color .12s}
.qk2 button:hover{background:var(--hov);color:var(--pri);border-color:var(--bd)}
.qk2 button .kbd{color:var(--tx3);font-size:10px;letter-spacing:.2px}
.qk2 button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}

/* ═══ 3. Ribbon 命令区：104px 展开 / 0 收起（高度够放下「图标 + 文字 + 分组名」） ═══ */
.rbn{background:var(--bg);border-bottom:1px solid var(--bd);padding:var(--sp2) var(--sp4) 0;
  height:104px;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;
  transition:height .16s ease,padding .16s ease,opacity .12s ease}
body.rmn .rbn{padding-top:0;padding-bottom:0;height:0;opacity:0;border-bottom:none;overflow:hidden}
.grp{display:flex;flex-direction:column;gap:2px;padding:0 var(--sp3) 6px;border-right:1px solid var(--bd2);flex:none}
.grp:last-child{border-right:none}
.grp .cmds{display:flex;gap:2px;flex:1;align-items:flex-start;flex-wrap:wrap;align-content:flex-start}
.grp .gname{text-align:center;font-size:10.5px;color:var(--tx2);font-weight:700;letter-spacing:1.5px;padding:4px 0 2px}
.cbtn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;
  width:74px;height:68px;padding:8px 4px 4px;border:none;background:transparent;cursor:pointer;
  border-radius:7px;color:var(--tx);transition:background .13s ease,transform .13s ease}
.cbtn:hover{background:var(--hov)}
.cbtn:hover .svgic{transform:translateY(-1px) scale(1.06)}
.cbtn:active{background:var(--pri-lt);transform:scale(.97)}
.cbtn:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.cbtn[aria-pressed=true]{background:var(--sel);color:var(--pri)}
.cbtn .ic{height:22px;display:flex;align-items:center;justify-content:center;color:var(--pri)}
.cbtn .lb{font-size:11px;line-height:1.3;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:68px}
.cbtn:disabled,.cbtn[disabled]{opacity:.45;cursor:not-allowed;background:transparent}

/* ═══ 4. 主内容 = Dock 工作区 ═══ */
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--sp2);padding:var(--sp2) 10px;background:var(--workbg);overflow:hidden}
.dockrow{flex:1;min-height:0;display:flex;gap:var(--sp2)}
.panel{background:var(--bg);border:1px solid var(--bd);border-radius:8px;display:flex;flex-direction:column;
  overflow:hidden;min-height:0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.phd{display:flex;align-items:center;height:30px;flex:none;padding:0 10px;background:var(--bg2);
  border-bottom:1px solid var(--bd);font-size:11px;font-weight:700;color:var(--tx2);gap:7px;letter-spacing:.5px}
.phd .hdic{color:var(--pri);display:flex;align-items:center}
.phd .cnt{margin-left:auto;font-weight:600;color:var(--tx3);font-size:10px;background:var(--bg3);border-radius:999px;padding:0 7px;line-height:16px}
.phd .tb{display:flex;gap:2px;margin-left:6px}
.phd .tb button{min-width:24px;height:20px;display:inline-flex;align-items:center;justify-content:center;
  border:none;background:transparent;cursor:pointer;border-radius:3px;
  color:var(--tx2);font-size:11px;white-space:nowrap;padding:0 5px;transition:background .12s,color .12s}
.phd .tb button:hover{background:var(--pri-lt);color:var(--pri)}
.phd .tb button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.pbd{flex:1;min-height:0;overflow:auto}
.p-nav{width:228px;flex:none}
body.hideL .p-nav{display:none}
.p-props{width:268px;flex:none}
body.hideR .p-props{display:none}
.p-log{height:152px;flex:none}
body.hideLog .p-log{display:none}

/* 左：导航树 */
.tree{padding:5px}
.tree .fnd{display:flex;gap:4px;padding:2px 4px 6px}
.tree .fnd input{flex:1;height:24px;font-size:11.5px;padding:0 7px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--tx)}
.tree .fnd input:focus{outline:none;border-color:var(--pri)}
.tree .nd .hd{display:flex;align-items:center;gap:5px;height:27px;padding:0 6px;border-radius:5px;cursor:pointer}
.tree .nd .hd:hover{background:var(--hov)}
.tree .nd .hd .arw{width:12px;font-size:9px;color:var(--tx3);transition:transform .12s}
.tree .nd.open>.hd .arw{transform:rotate(90deg)}
.tree .nd .kids{display:none;margin-left:15px;border-left:1px solid var(--bd2);padding-left:5px}
.tree .nd.open>.kids{display:block}
.tree .lf{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:5px;cursor:pointer;color:var(--tx2);font-size:12px}
.tree .lf:hover{background:var(--hov);color:var(--tx)}
.tree .lf.on{background:var(--sel);color:var(--pri);font-weight:600}
.tree .lf .sp2{flex:1}
.tree .lf .hbtn{visibility:hidden;border:none;background:transparent;color:var(--tx3);cursor:pointer;font-size:11px}
.tree .lf:hover .hbtn{visibility:visible}
.tree .lf .hbtn:hover{color:var(--pri)}
.tree .lf input.rnm{width:100%;height:20px;font-size:12px;padding:0 4px;border:1px solid var(--pri);border-radius:3px;background:var(--bg);color:var(--tx)}
.tree .empty{padding:14px 10px;color:var(--tx3);font-size:11px;text-align:center}

/* 中：文档面板 */
.dts{display:flex;align-items:flex-end;height:32px;flex:none;padding:5px 8px 0;gap:4px;background:var(--bg2);
  border-bottom:1px solid var(--bd);overflow-x:auto}
.dts .dkb{display:flex;gap:3px;margin-right:8px;align-self:center}
.dts .dkb button{border:1px solid var(--bd);background:var(--bg);border-radius:4px;padding:2px 8px;
  cursor:pointer;font-size:10px;color:var(--tx2)}
.dts .dkb button:hover{border-color:var(--pri);color:var(--pri)}
.dts .dkb button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.dt{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 16px;cursor:pointer;font-size:12px;color:var(--tx2);
  background:var(--bg3);border:1px solid var(--bd2);border-bottom:none;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);user-select:none;white-space:nowrap}
.dt:hover{color:var(--tx)}
.dt.on{background:var(--bg);color:var(--tx);font-weight:600;border-bottom:2px solid var(--pri)}
.dt .x{width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:10px;color:var(--tx3)}
.dt .x:hover{background:var(--err);color:#fff}
.dbody{flex:1;min-height:0;overflow:auto;padding:var(--sp3) var(--sp4) 26px}
.doc .crumb{font-size:11.5px;color:var(--tx3);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.doc .crumb svg{color:var(--tx3)}
.doc h1{font-size:19px;margin-bottom:4px}
.doc .alias{font-size:11.5px;color:var(--tx3);font-family:Consolas,monospace;margin:-2px 0 6px;letter-spacing:.2px}
.doc .dsc{color:var(--tx2);font-size:12.5px;margin-bottom:var(--sp3);line-height:1.7}
.ftg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ftg span{font-size:10.5px;padding:1px 9px;border-radius:10px;background:var(--pri-lt);color:var(--pri);font-weight:600}
.smt{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin-bottom:14px}
.smt button{border:none;background:var(--bg2);padding:4px 18px;cursor:pointer;font-size:11px;color:var(--tx2)}
.smt button.on{background:var(--pri);color:#fff;font-weight:600}
.smcode{background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;padding:12px 14px;
  font-family:Consolas,monospace;font-size:11.5px;line-height:1.65;white-space:pre;overflow:auto;
  max-height:300px;margin-bottom:14px;color:var(--tx)}
.demo{border:1px solid var(--bd2);border-radius:8px;padding:var(--sp4);background:var(--bg);margin-bottom:var(--sp3)}
.demo h4{font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:10px;letter-spacing:.5px}
.hint{font-size:11px;color:var(--tx3);margin-top:8px;line-height:1.6}
.btn{border:1px solid var(--bd);background:var(--bg);border-radius:5px;padding:5px 16px;cursor:pointer;font-size:12px}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn.pri{border-color:var(--pri);color:var(--pri);background:var(--pri-lt)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.danger:hover{background:var(--err);color:#fff;border-color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ═══ 文档页通用件（沿用原原型命名，页面内容原样复用） ═══ */
h3.dh{font-size:15px;margin:0 0 2px}
p.dsub{color:var(--tx2);font-size:12px;margin-bottom:12px}
.card{border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:12px;background:var(--bg)}
.card h4{font-size:12.5px;margin-bottom:8px;color:var(--tx)}
.card .hint{font-size:11px;color:var(--tx3);margin-top:6px}
table.tb{width:100%;border-collapse:collapse;font-size:11.5px}
table.tb th,table.tb td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--bd2)}
table.tb th{color:var(--tx3);font-weight:600;font-size:11px}
code{font:11.5px Consolas,"Cascadia Mono",monospace;background:var(--code);border:1px solid var(--bd2);border-radius:3px;padding:0 4px}
pre.code{background:var(--code);border:1px solid var(--bd2);border-radius:6px;padding:10px 12px;overflow:auto;
  font:11.5px/1.65 Consolas,"Cascadia Mono",monospace;color:var(--tx);margin:8px 0;white-space:pre}
.row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
input.tin,select.tin{height:26px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);padding:0 8px;font-size:12px}
input.tin:focus,select.tin:focus{outline:none;border-color:var(--pri)}
textarea.tin{border:1px solid var(--bd);border-radius:5px;background:var(--bg);padding:8px;font:11.5px/1.6 Consolas,monospace;width:100%;resize:vertical;color:var(--tx)}
button.b{border:1px solid var(--bd);background:var(--bg);border-radius:5px;height:26px;padding:0 10px;cursor:pointer;font-size:12px}
button.b:hover{border-color:var(--pri);color:var(--pri)}
button.b:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
button.b.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.b.pri:hover{background:var(--pri-h)}
button.b:disabled{opacity:.45;cursor:not-allowed}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list{border:1px solid var(--bd);border-radius:6px;min-height:120px;max-height:220px;overflow:auto}
.list .it{display:flex;align-items:center;gap:8px;padding:5px 9px;font-size:11.5px;cursor:pointer;border-bottom:1px solid var(--bd2)}
.list .it:hover{background:var(--hov)}
.list .it.on{background:var(--sel);color:var(--pri)}
.lgst{height:170px;overflow:auto;border:1px solid var(--bd);border-radius:6px;padding:6px 9px;
  font:11.5px/1.7 Consolas,monospace;background:var(--code)}
.lgst .w{color:var(--warn)}.lgst .e{color:var(--err)}.lgst .d{color:var(--tx3)}
.hex{font:11.5px/1.8 Consolas,monospace;background:var(--code);border:1px solid var(--bd2);border-radius:6px;padding:8px 10px;word-break:break-all}
.kv{display:flex;gap:8px;align-items:center;font-size:11.5px;margin:3px 0}
.kv .k{color:var(--tx3);min-width:86px}

/* ═══ 场景页：工作流轨道 + 子标签 ═══ */
.flow{position:relative;display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:14px;
  padding:10px 12px;border:1px solid var(--bd);border-radius:10px;
  background:linear-gradient(180deg,var(--bg2),var(--bg))}
.flow::after{content:"";position:absolute;left:18px;right:18px;top:50%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--bd2),var(--bd),var(--bd2));z-index:0}
.flow .st{position:relative;z-index:1;display:flex;align-items:center;gap:7px;margin-right:14px;
  padding:4px 12px 4px 5px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);
  font-size:11.5px;color:var(--tx2);cursor:pointer;transition:all .16s ease}
.flow .st:hover{border-color:var(--pri);color:var(--pri);transform:translateY(-1px)}
.flow .st .n{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--bg3);color:var(--tx3);font-size:10px;font-weight:700;flex:none}
.flow .st .si{display:none}
.flow .st.cur{border-color:var(--pri);background:var(--pri-lt);color:var(--pri);font-weight:700;box-shadow:0 0 0 3px var(--pri-lt)}

.catalog-header h1{font-size:19px;margin:0 0 4px}.catalog-header p{font-size:11px;color:var(--pri);margin:0}.cbtn .lb{max-width:160px}
.catalog-category{padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--bg2)}
.catalog-category h3{font-size:13px;color:var(--pri);margin:0 0 8px}.catalog-category .btn{margin:0 6px 6px 0}
.catalog-index h2{font-size:18px;margin:0 0 10px}.catalog-index>p{color:var(--tx2);font-size:12px;margin:0 0 10px}
.catalog-experiments summary{cursor:pointer;font-size:14px;font-weight:600;padding:14px 0;color:var(--pri)}
.catalog-source{border-top:1px solid var(--line);margin-top:16px;padding-top:8px}.catalog-source pre{max-height:200px;overflow:auto;font:12px/1.7 Consolas,monospace;padding:12px;background:var(--bg2)}
.catalog-input{display:block;width:100%;min-height:72px;box-sizing:border-box;margin-bottom:10px;resize:vertical;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:10px;font:13px/1.6 Consolas,monospace}
.catalog-result{white-space:pre-wrap;font:12px/1.7 Consolas,monospace}.catalog-titlebar{display:flex;justify-content:space-between;padding:12px;margin-top:12px;background:var(--bg2);border-radius:6px}
.catalog-line{display:block;width:280px;height:180px;color:var(--pri);margin-top:16px}.catalog-status{display:flex;gap:12px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg2)}
.catalog-status strong{background:var(--pri);color:#fff;padding:5px 10px}.catalog-status span{padding:5px 10px}.catalog-status.card{flex-direction:column;padding:12px;min-width:80px}
.rt2{overflow-x:auto;white-space:nowrap}.cmds{flex-wrap:wrap}.rbn{max-height:180px;overflow:auto}.cbtn{min-width:95px;max-width:170px}.cbtn .lb{white-space:normal;overflow-wrap:anywhere;font-size:11px}.lb{max-width:none}
.studio-title{font-size:28px!important}.studio-hero{padding-top:0!important;padding-bottom:4px!important}.catalog-index .btn:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){.catalog-index .btn:hover{transform:none}}

.studio-hero h2{font-size:26px!important;letter-spacing:-.5px}.studio-hero{margin:8px 0 14px!important}.studio-sigil{width:90px;height:90px}.studio-meta{padding-bottom:12px;margin-bottom:10px}

.cmds{flex-wrap:nowrap}.cbtn{flex:0 0 auto;width:auto;height:62px}.rbn{overflow-x:auto;overflow-y:hidden}.catalog-header .catalog-description{color:var(--tx2);font-size:12px;margin-top:6px;line-height:1.7}

.catalog-status[data-level="Debug"]{--status-color:#54a9ff}.catalog-status[data-level="Info"]{--status-color:var(--ok)}.catalog-status[data-level="Warn"]{--status-color:var(--warn)}.catalog-status[data-level="Error"],.catalog-status[data-level="Fatal"]{--status-color:var(--err)}.catalog-status{border-color:var(--status-color);background:color-mix(in srgb,var(--status-color) 12%,var(--bg2))}.catalog-status strong{background:var(--status-color)}.catalog-status.card strong{background:transparent;color:var(--status-color)}

.catalog-grid{width:100%;border-collapse:collapse;table-layout:fixed}.catalog-grid th,.catalog-grid td{padding:9px;text-align:left;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis}.demo progress{width:100%;height:6px;margin:14px 0;accent-color:var(--pri)}.catalog-connected{color:var(--pri);font:12px Consolas,monospace}

/* 与原生外壳共用 Ribbon 尺寸，命令保留完整 API 名。 */
body{font-family:"Segoe UI","Microsoft YaHei UI",sans-serif}
.rbn{height:104px;padding:4px 12px 2px;display:flex;gap:12px;align-items:flex-start}
.grp{flex:none;padding-right:12px;margin-right:0}.grp .cmds{display:grid;grid-auto-flow:column;grid-template-rows:80px;gap:0 4px}
.cbtn{min-width:95px;max-width:none;padding:3px 8px;height:80px}.cbtn .lb{max-width:none;white-space:nowrap;overflow-wrap:normal}
.ribbon-small .cmds{grid-template-rows:repeat(2,40px)}.ribbon-small .cbtn{height:40px;flex-direction:row;justify-content:flex-start}.cbtn .ic{display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none}.cbtn .ic svg{width:32px;height:32px}
.qk button{width:30px;height:30px;color:var(--tx2)}.qk button svg{width:16px;height:16px}.qk button:hover{color:var(--pri)}.qk button:active{background:var(--pri-lt)}

/* 实心操作沿用原生 Primary，强调文字仍使用 Accent。 */
.smt button.on,button.b.pri,.flow .st.cur .n{background:var(--button-bg);border-color:var(--button-bg);color:var(--on-primary)}
button.b.pri:hover{background:var(--button-hover);border-color:var(--button-hover)}
button.b.pri:active{background:var(--button-pressed);border-color:var(--button-pressed)}
.flow .st.done .n{color:var(--badge-text)}
.cpm .it.on{background:var(--sel);color:var(--tx)}.cpm .it.on .g,.cpm .it.on .k{color:var(--tx2)}
.grp .gname{height:18px;padding-top:2px;font-size:10px;letter-spacing:0}
.p-nav{width:16%;min-width:164px}.p-props{width:17%;min-width:220px}.p-log{height:14%;min-height:60px}
.tree .lf{font-size:11.5px;height:30px}.tree .nd .hd{height:31px;font-size:11px}
.dbody:not([data-page="welcome"]){padding:0}.catalog-header{padding:10px 16px;gap:12px}.catalog-header h1{line-height:1.35}.catalog-header .catalog-description{margin-top:3px;line-height:1.5}
.dbody:not([data-page="welcome"])>[id^="seg-"]{padding:14px 16px}.demo{border-radius:10px}
[data-density="compact"] .cbtn{min-width:80px;padding:3px 4px}

.dbody[data-page="welcome"]{padding:16px 20px}

.qk2 button svg{width:18px;height:18px}.rw textarea{width:100%;min-height:64px;resize:vertical;box-sizing:border-box;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:4px}.rw:has(textarea){height:auto;min-height:74px}

/* 文档与参数一起布局，拖出文档时共同移动。 */
.document-workspace{display:grid;grid-template-columns:minmax(160px,1fr) 5px minmax(180px,var(--document-properties-width,260px));flex:1;min-height:0;min-width:0;overflow:hidden}
.document-workspace>.dbody{min-width:0;min-height:0;overflow:auto}
.document-workspace>.p-props{width:auto;min-width:0;min-height:0;border-left:0}
.document-splitter{background:var(--line);cursor:col-resize;touch-action:none}
.document-splitter:hover,.document-splitter:focus-visible{background:var(--pri);outline:none}
body.hideR .document-workspace{grid-template-columns:minmax(0,1fr) 0 0}

</style>

function propKey(pageId, p) { return (p.global ? "" : (pageId || "")) + "|" + p.id; }

  var opts = p.options || [];

   opts.map(function (o) { return "<option" + (o === p.value ? " selected" : "") + ">" + esc(o) + "</option>"; }).join("") + "</select>";
 } else if (p.type === "bool" || p.kind === "sw") {
  ctl = '<div class="sw' + (p.value ? " on" : "") + '" data-id="' + p.id + '" role="switch" tabindex="0" title="' + esc(p.label || p.name) + '"></div>';

  ctl = '<input type="range" data-id="' + p.id + '" min="' + p.min + '" max="' + p.max + '" step="' + (p.step || 1) + '" value="' + p.value + '">';

  else if (p.kind === "ro") { }
  else if (p.type === "combo" || p.kind === "sel") el.onchange = function () { applyProp(id, p, el.value); };
  else el.onchange = function () { applyProp(id, p, el.value); };

  density: document.documentElement.dataset.density, lang: LANG, tab: curTab,

 };

}
function guideGo(steps) { gSteps = steps; gIdx = 0; $("gMask").classList.add("on"); $("gTip").classList.add("on"); showStep(); }
function showStep() {
 var s = gSteps[gIdx];
 if (!s) { gCloseGuide(); return; }
 var el = document.querySelector(s.sel);
 if (!el) { gIdx++; showStep(); return; }
 var r = el.getBoundingClientRect(), sp = $("gSpot");
 sp.style.display = "block";
 sp.style.left = (r.left - 6) + "px"; sp.style.top = (r.top - 6) + "px";
 sp.style.width = (r.width + 12) + "px"; sp.style.height = (r.height + 12) + "px";
 var tip = $("gTip");
 tip.style.display = "block";
 tip.classList.remove("on"); void tip.offsetWidth; tip.classList.add("on");
 var tw = tip.offsetWidth || 320;
 tip.style.left = clamp(r.left, 10, Math.max(10, innerWidth - tw - 10)) + "px";
 var ty = r.bottom + 12;
 if (ty + 170 > innerHeight) ty = Math.max(10, r.top - 170);
 tip.style.top = ty + "px";
 $("gT").textContent = s.t; $("gD").textContent = s.d;
 $("gN").textContent = (gIdx + 1) + " / " + gSteps.length;
 $("gPrev").textContent = tt("g.prev"); $("gNext").textContent = tt("g.next");
 $("gSkip").textContent = tt("g.skip"); $("gClose").textContent = tt("g.close");
 log2both("引导：" + s.t);
}
function gNextStep() { gIdx++; if (gIdx >= gSteps.length) gCloseGuide(); else showStep(); }
function gPrevStep() { gIdx = Math.max(0, gIdx - 1); showStep(); }
function gCloseGuide() { $("gMask").classList.remove("on"); $("gTip").classList.remove("on"); $("gSpot").style.display = "none"; $("gTip").style.display = "none"; }

function TK_CORE_FN() {

/* ---- Core 扩展 + 更新检查 ---- */
window.coreRun = function (k) {
 var s = ($("coreIn") || {}).value || "";
 if (k === "truncate") { $("coreOut").textContent = "原文：" + s + NL + "截断 18：" + (s.length > 18 ? s.slice(0, 18) + "…" : s); }
 else if (k === "slug") { $("coreOut").textContent = "正则替换非字母数字：" + s.replace(/[^A-Za-z0-9]+/g, "_").toLowerCase(); }
 else { $("coreOut").textContent = "ByteUnit 格式化：" + [1024, 1048576, 3221225472].map(function (b, i) { return ["1.00 KB", "1.00 MB", "3.00 GB"][i] + "  (" + b + " B)"; }).join(NL); }
 log2both("Core 扩展演示：" + k);
};
window.upCheck = function () {
 var repo = ($("upRepo") || {}).value || "", cur = ($("upCur") || {}).value || "";
 var etag = ($("upEtag") || {}).checked, out = $("upOut");
 if (!out) return;
 out.textContent = "GET https://api.github.com/repos/" + repo + "/releases/latest" + (etag ? '  If-None-Match: W/"etag-cache"' : "") + NL + "→ 200 OK（命中缓存则为 304，不消耗配额）";
 setTimeout(function () {
  out.textContent += NL + NL + "UpdateCheckResult.Succeeded = true" + NL + "Update = { Version: 1.1.0, Tag: v1.1.0 }" + NL + "→ 对比当前 " + cur + "：发现新版本 v1.1.0";
  setSync(stampNow());
  notify("warn", tt("nc.warn"), "发现新版本 v1.1.0");
  log2both("更新检查：发现新版本 v1.1.0", "warn");
 }, 260);
};

/* ---- 进程内总线 ---- */
window._busOn = true;
window.busPublish = function () {
 var m = ($("busMsg") || {}).value || "";
 log2both("Publish(GreetCommand{ Name = \"" + m + "\" })");

    }}); });

    REG('titlebar',{zh:apiMeta(entries.titlebar),xaml:'<codewf:CodeWFTitleBar Title="{Binding Title}" />',props:[],render:function(el){
      el.innerHTML='<div class="demo"><h4>Title</h4><input value="CodeWFTitleBar"><div class="catalog-titlebar"><span>CodeWF</span><strong>CodeWFTitleBar</strong><span>.NET</span></div></div>';

    }});
    REG('diagonal-line',{zh:apiMeta(entries['diagonal-line']),xaml:'<codewf:LeftTop2RightBottomLine BorderThickness="{Binding Thickness}" />',props:[],render:function(el){

  renderDoc=function(id){

    var source=$('dBody').querySelector('.catalog-source');

      else {
      function showCode(language){source.querySelector('pre').textContent=pg[language]||entry.code||entry.api;}

      }

    renderPGrid(id);

  };
  PROTO.welcome.zh.t=pt('welcome');
  var widths = {}, workspace = document.querySelector('.document-workspace');
  var splitter = document.querySelector('.document-splitter');
  function resizeProperties(width) {
    var bounded = Math.max(180, Math.min(width, workspace.clientWidth - 165));
    widths[ACTIVE_DOC] = bounded;
    workspace.style.setProperty('--document-properties-width', bounded + 'px');
    splitter.setAttribute('aria-valuenow', String(Math.round(bounded)));
  }
  splitter.onpointerdown = function(event) {
    var origin = event.clientX, initial = document.querySelector('.p-props').getBoundingClientRect().width;
    splitter.setPointerCapture(event.pointerId);
    splitter.onpointermove = function(move) { resizeProperties(initial + origin - move.clientX); };
    splitter.onpointerup = splitter.onpointercancel = function() { splitter.onpointermove = null; };
  };
  splitter.onkeydown = function(event) {
    if(event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    resizeProperties(document.querySelector('.p-props').getBoundingClientRect().width + (event.key === 'ArrowLeft' ? 16 : -16));
  };
  var renderWithProperties = renderDoc;
  renderDoc = function(id) {
    workspace.style.setProperty('--document-properties-width', (widths[id] || 260) + 'px');
    return renderWithProperties(id);
  };
  curTab='home';
  // 浏览器中模拟桌面窗体按钮，不影响浏览器自身窗口。
  var frame=document.querySelector('.win');
  function windowLabels(){
    var labels=LANG==='en-US'?{minimize:'Minimize',maximize:'Maximize / restore',close:'Close'}:{minimize:'最小化',maximize:'最大化 / 还原',close:'关闭'};
    document.querySelectorAll('[data-window-action]').forEach(function(button){button.title=labels[button.dataset.windowAction];button.setAttribute('aria-label',button.title);});
  }
  function windowAction(action){
    if(action==='maximize'){document.body.classList.toggle('prototype-maximized');return;}
    frame.style.display='none';
    var restore=document.createElement('button');restore.className='prototype-window-restore';
    restore.textContent=LANG==='en-US'?'Reopen demo window':'重新打开演示窗口';
    restore.onclick=function(){frame.style.display='';restore.remove();};
    document.body.appendChild(restore);restore.focus();
  }
  document.querySelectorAll('[data-window-action]').forEach(function(button){button.onclick=function(){windowAction(button.dataset.windowAction);};});
  document.querySelector('.cap').ondblclick=function(event){if(!event.target.closest('button,select'))windowAction('maximize');};
  var localizeWindow=setLang;
  setLang=function(language){localizeWindow(language);windowLabels();};
  windowLabels();
  renderRTabs();renderTree();renderDocTabs();
  if(ACTIVE_DOC&&entries[ACTIVE_DOC])renderDoc(ACTIVE_DOC);else openDoc('welcome');
})();

<script>
/* Browser interaction previews. Production API calls run in the native demo. */
"use strict";
(function(){
  function text(key){return window.CodeWFCatalogText[LANG][key]||key;}
  function register(api,render){
    var entry=window.CodeWFDemoCatalog.flatMap(function(g){return g.items;}).find(function(e){return e.api===api;});
    REG(entry.prototypeId,{zh:{t:entry.titleZh,d:entry.package,f:[]},en:{t:entry.titleEn,d:entry.package,f:[]},cs:entry.code,props:[],render:render});
  }
  ['I18nManager','JsonLocalizer'].forEach(function(api){register(api,function(el){
    var input=api==='JsonLocalizer'?'zh-CN':'Demo.Item.Welcome';
    el.innerHTML='<div class="demo"><p>'+esc(text('LocalizationHint'))+'</p><input class="catalog-input" value="'+esc(input)+'"><button class="btn pri">'+esc(text('Run'))+'</button></div><div class="demo"><h4>'+esc(text('Output'))+'</h4><pre class="catalog-result">'+esc(text('Ready'))+'</pre></div>';
    el.querySelector('button').onclick=function(){
      var value=el.querySelector('.catalog-input').value.trim(),result;
      if(api==='I18nManager')result='Culture = '+LANG+'\nLanguages = zh-CN, en-US\n'+value+' = '+(value==='Demo.Item.Welcome'?(LANG==='zh-CN'?'介绍':'Introduction'):value);
      else result='Culture = '+value+'\n'+(value.toLowerCase()==='zh-cn'?'必须指定 GitHub 仓库名（UpdateServiceOptions.Repository）。':'Specify a GitHub repository (UpdateServiceOptions.Repository).');
      el.querySelector('.catalog-result').textContent=result+'\n'+text('Preview');
    };
  });});
  register('UpdateService',function(el){
    var state='idle',timer=null;
    el.innerHTML='<div class="demo"><p>'+esc(text('UpdateFixtureHint'))+'</p><input class="catalog-input" value="Hello update"><div class="row"><button class="btn pri" data-check>'+esc(text('UpdateCheck'))+'</button><button class="btn" data-download>'+esc(text('UpdateDownload'))+'</button><button class="btn" data-cancel>'+esc(text('UpdateCancel'))+'</button></div><progress max="100" value="0"></progress><pre class="catalog-result">'+esc(text('Ready'))+'</pre></div>';
    function paint(){el.querySelector('[data-download]').disabled=state!=='available';el.querySelector('[data-check]').disabled=state==='downloading';el.querySelector('[data-cancel]').disabled=state!=='downloading';}
    el.querySelector('[data-check]').onclick=function(){state='available';el.querySelector('progress').value=0;el.querySelector('.catalog-result').textContent=text('UpdateAvailable')+'\n'+text('Preview');paint();};
    el.querySelector('[data-download]').onclick=function(){state='downloading';paint();var progress=el.querySelector('progress');progress.value=0;timer=setInterval(function(){if(!el.isConnected){clearInterval(timer);return;}progress.value+=10;if(progress.value>=100){clearInterval(timer);state='downloaded';el.querySelector('.catalog-result').textContent=text('UpdateVerified');paint();}},80);};
    el.querySelector('[data-cancel]').onclick=function(){clearInterval(timer);state='available';el.querySelector('.catalog-result').textContent=text('UpdateCanceled');paint();};paint();
  });
  register('DataTableExtensions',function(el){
    el.innerHTML='<div class="demo"><p>'+esc(text('TableHint'))+'</p><textarea class="catalog-input">Ada,42\nLin,24</textarea><div class="row"><button class="btn" data-format="CSV">'+esc(text('TableCsv'))+'</button><button class="btn" data-format="Excel">'+esc(text('TableExcel'))+'</button></div></div><div class="demo"><h4>'+esc(text('Output'))+'</h4><table class="catalog-grid"><thead><tr><th>Name</th><th>Value</th></tr></thead><tbody></tbody></table><p class="catalog-result">'+esc(text('Ready'))+'</p></div>';
    el.querySelectorAll('[data-format]').forEach(function(button){button.onclick=function(){
      var rows=el.querySelector('textarea').value.trim().split('\n').map(function(l){return l.split(',');});
      if(!rows.length||rows.some(function(c){return c.length!==2;})){el.querySelector('.catalog-result').textContent=text('TableFormat');return;}
      el.querySelector('tbody').innerHTML=rows.map(function(c){return '<tr><td>'+esc(c[0])+'</td><td>'+esc(c[1])+'</td></tr>';}).join('');
      el.querySelector('.catalog-result').textContent=button.dataset.format+' · Rows = '+rows.length+'\n'+text('Preview');
    };});
  });
  register('ActionHelper',function(el){
    el.innerHTML='<div class="demo"><p>'+esc(text('ActionFormat'))+'</p><input class="catalog-input" value="20,100"><button class="btn pri">'+esc(text('Run'))+'</button><p class="catalog-result"></p></div>';
    el.querySelector('button').onclick=function(){var values=el.querySelector('.catalog-input').value.split(',').map(Number),valid=values.length===2&&values.every(function(n){return Number.isInteger(n)&&n>=0&&n<=5000;});el.querySelector('.catalog-result').textContent=valid?'CheckOvertime = '+(values[0]<=values[1])+'\n'+text(values[0]<=values[1]?'ActionCompleted':'ActionTimedOut'):text('ActionFormat');};
  });
  ['TcpSocketClientFileSystemFeature','TcpSocketServerFileSystemFeature'].forEach(function(api){register(api,function(el){
    var running=false,folder=false,uploaded=false,busy=false,timer=null;
    el.innerHTML='<div class="demo"><h4>'+esc(text('FileSession'))+'</h4><p>'+esc(text(api.includes('Server')?'FileServerHint':'FileClientHint'))+'</p><div class="row"><button class="btn pri" data-op="start">'+esc(text('FileStart'))+'</button><button class="btn" data-op="stop">'+esc(text('FileStop'))+'</button></div></div><div class="demo"><h4>'+esc(text('FileOperations'))+'</h4><div class="row">'+[['browse','FileBrowse'],['create','FileCreate'],['delete','FileDelete'],['upload','FileUpload'],['download','FileDownload'],['cancel','FileCancel']].map(function(pair){return '<button class="btn" data-op="'+pair[0]+'">'+esc(text(pair[1]))+'</button>';}).join('')+'</div><progress max="100" value="0"></progress><table class="catalog-grid"><thead><tr><th>Name</th><th>Path</th></tr></thead><tbody></tbody></table></div><div class="demo"><pre class="catalog-result">'+esc(text('Preview'))+'</pre></div>';
    function append(s){el.querySelector('.catalog-result').textContent+='\n'+s;}
    function paint(){
      el.querySelectorAll('[data-op]').forEach(function(button){var op=button.dataset.op;button.disabled=op==='start'?running:op==='stop'?!running:op==='cancel'?!busy:!running||busy;});
      el.querySelector('tbody').innerHTML=(running?['sample.txt'].concat(folder?['demo-folder']:[]).concat(uploaded?['payload.bin']:[]):[]).map(function(name){return '<tr><td>'+name+'</td><td>session/server/'+name+'</td></tr>';}).join('');
    }
    el.querySelectorAll('[data-op]').forEach(function(button){button.onclick=function(){
      var op=button.dataset.op;
      if(op==='start'){running=true;append(text('TransportStarted'));}
      if(op==='stop'){running=false;busy=false;clearInterval(timer);append(text('FileStopped'));}
      if(op==='create'){folder=true;append('CreateDirectoryAsync: demo-folder');}
      if(op==='delete'){folder=false;append('DeletePathAsync: demo-folder');}
      if(op==='browse')append('BrowseFileSystemAsync');
      if(op==='cancel'){clearInterval(timer);busy=false;append(text('FileCancelled'));}

        timer=setInterval(function(){if(!el.isConnected){clearInterval(timer);return;}progress.value+=10;if(progress.value>=100){clearInterval(timer);busy=false;if(op==='upload')uploaded=true;append((op==='upload'?'UploadFileAsync':'DownloadFileAsync')+' · Bytes = '+el.dataset.transferSize+' · '+text('Preview'));paint();}},80);
      }
      paint();
    };});paint();
  });});
  ['EventServer','EventClient','TcpSocketServer','TcpSocketClient','UdpSocketServer','UdpSocketClient'].forEach(function(api){register(api,function(el){
    var running=false,subscribed=true,event=api.startsWith('Event');

    function append(s){el.querySelector('.catalog-result').textContent+='\n'+s;}
    function paint(){el.querySelector('[data-start]').disabled=running;el.querySelector('[data-stop]').disabled=!running;el.querySelector('[data-send]').disabled=!running;el.querySelector('.catalog-connected').textContent=text('TransportConnected')+' = '+running;}
    el.querySelector('[data-start]').onclick=function(){running=true;append(text('TransportStarted'));paint();};
    el.querySelector('[data-stop]').onclick=function(){running=false;append(text('FileStopped'));paint();};
    el.querySelector('[data-send]').onclick=function(){append(event&&!subscribed?text('TransportNoSubscription'):'Sent = '+el.querySelector('.catalog-input').value+'\nReceived = '+el.querySelector('.catalog-input').value);};
    if(event)el.querySelector('[data-subscribe]').onchange=function(e){subscribed=e.target.checked;};paint();
  });});
  REG('flow-runtime',{zh:{t:pt('flow-runtime'),d:text('RuntimeTourHint'),f:[]},props:[],render:function(el){
    var steps=text('RuntimeTourSteps').split('|'),routes=['bus','prism','bus','aspnet','log-core'];

    el.querySelectorAll('[data-tour]').forEach(function(button){button.onclick=function(){show(Number(button.dataset.tour));};});show(0);
  }});
  if(ACTIVE_DOC)renderDoc(ACTIVE_DOC);
})();

<style>

<script>
