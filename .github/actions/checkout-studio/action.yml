name: Checkout Studio UI source
description: Load the pinned CodeWF.Avalonia source used by the native Demo.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: dotnet9/CodeWF.Avalonia
        ref: 11efa11b30310c13df33b1b62ee247215d8f510e
        path: .sources/CodeWF.Avalonia
        persist-credentials: false
    - shell: pwsh
      run: '"CodeWFAvaloniaSource=${{ github.workspace }}/.sources/CodeWF.Avalonia" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
