name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: 构建与测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SourceLink 与 EmbedUntrackedSources 需要完整历史

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 还原
        run: dotnet restore CodeWF.Toolkit.slnx

      - name: 构建
        run: dotnet build CodeWF.Toolkit.slnx -c Release --no-restore

      - name: 测试
        run: dotnet test CodeWF.Toolkit.slnx -c Release --no-build

  aot-smoke:
    name: AOT 冒烟（Demo 发布与运行）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: AOT 发布 Demo
        run: dotnet publish demo/CodeWF.Toolkit.Demo/CodeWF.Toolkit.Demo.csproj -c Release -r win-x64 -p:PublishAot=true -o artifacts/aot-smoke

      - name: 运行冒烟演示
        run: artifacts\aot-smoke\CodeWF.Toolkit.Demo.exe --smoke

  aot-smoke-avalonia:
    name: AOT 冒烟（Avalonia 演示台发布与运行）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: AOT 发布 Avalonia 演示台
        run: dotnet publish demo/CodeWF.Toolkit.Demo.Avalonia/CodeWF.Toolkit.Demo.Avalonia.csproj -c Release -r win-x64 -p:PublishAot=true -o artifacts/aot-smoke-avalonia

      # 图形界面的运行冒烟在无头 CI 上不稳定：先保证 AOT 能发布，运行允许失败不阻塞流水线
      - name: 运行冒烟演示
        continue-on-error: true
        run: artifacts\aot-smoke-avalonia\CodeWF.Toolkit.Demo.Avalonia.exe --smoke
