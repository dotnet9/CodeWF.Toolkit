name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: 构建与测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SourceLink 与 EmbedUntrackedSources 需要完整历史

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 还原
        run: dotnet restore CodeWF.Toolkit.slnx

      - name: 验证 T4 国际化资源映射
        shell: pwsh
        run: ./scripts/sync_localization_keys.ps1 -Check

      - name: 构建
        run: dotnet build CodeWF.Toolkit.slnx -c Release --no-restore

      - name: 测试
        run: dotnet test CodeWF.Toolkit.slnx -c Release --no-build

  aot-smoke:
    name: AOT 冒烟（Demo 发布与运行）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: AOT 发布 Demo
        run: dotnet publish demo/CodeWF.Toolkit.Demo/CodeWF.Toolkit.Demo.csproj -c Release -r win-x64 -p:PublishAot=true -o artifacts/aot-smoke

      - name: 运行冒烟演示
        run: artifacts\aot-smoke\CodeWF.Toolkit.Demo.exe --smoke

      - name: AOT 发布国际化与更新流程验证
        run: dotnet publish tests/CodeWF.Toolkit.AotSmoke/CodeWF.Toolkit.AotSmoke.csproj -c Release -r win-x64 -o artifacts/aot-library-smoke

      - name: 验证嵌入资源、更新缓存与校验下载
        run: artifacts\aot-library-smoke\CodeWF.Toolkit.AotSmoke.exe

  aot-smoke-avalonia:
    name: AOT 冒烟（Avalonia 演示台发布与运行）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: AOT 发布 Avalonia 演示台
        shell: pwsh
        run: pwsh scripts/publish_toolkit_demo.ps1 -RuntimeIdentifier win-x64

      # 冒烟现在逐页构建并逐色板渲染，退出码可作门禁（不再 continue-on-error）
      - name: 运行冒烟演示
        run: artifacts\publish\win-x64\CodeWF.Toolkit.Demo.Avalonia\CodeWF.Toolkit.Demo.Avalonia.exe --smoke

  prototype-audit:
    name: 原型路由与语言审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: design/tests/package-lock.json
      - name: 验证目录生成物
        shell: pwsh
        run: ./scripts/sync_design_catalog.ps1 -Check
      - name: 安装审计依赖
        working-directory: design/tests
        run: npm ci
      - name: 安装 Chromium
        working-directory: design/tests
        run: npx playwright install --with-deps chromium
      - name: 检查路由、语言和导航
        working-directory: design/tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prototype-audit-failure
          path: design/tests/artifacts/
